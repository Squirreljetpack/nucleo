[package]
name        = "matchmaker-nucleo"
description = "plug and play high performance fuzzy matcher (matchmaker fork)"
authors     = ["Pascal Kuthe <pascalkuthe@pm.me>", "Squirreljetpack"]
version     = "0.1.0"
edition     = "2024"
license     = "MPL-2.0"
repository  = "https://github.com/Squirreljetpack/nucleo"
readme      = "README.md"
exclude     = ["/typos.toml", "/tarpaulin.toml", "/bench", "/tests", "/.github"]

[lib]

[dependencies]
parking_lot    = { version = "0.12.5", features = ["send_guard", "arc_lock"] }
rayon          = "1.12.0"
log            = "0.4.33"
memchr         = "2.8.3"
unicode-segmentation = { version = "1.13", optional = true }

[features]
default = ["unicode-normalization", "unicode-casefold", "unicode-segmentation"]
unicode-normalization = []
unicode-casefold = []
unicode-segmentation = ["dep:unicode-segmentation"]
